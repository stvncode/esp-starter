<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square with gradient -->
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <!-- Chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="white" fill-opacity="0.95"/>
  <!-- Chip pins left -->
  <rect x="5" y="12" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="5" y="16" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="5" y="20" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <!-- Chip pins right -->
  <rect x="24" y="12" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="24" y="16" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="24" y="20" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <!-- Chip pins top -->
  <rect x="12" y="5" width="2" height="3" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="16" y="5" width="2" height="3" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="20" y="5" width="2" height="3" rx="0.5" fill="white" fill-opacity="0.7"/>
  <!-- Chip pins bottom -->
  <rect x="12" y="24" width="2" height="3" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="16" y="24" width="2" height="3" rx="0.5" fill="white" fill-opacity="0.7"/>
  <rect x="20" y="24" width="2" height="3" rx="0.5" fill="white" fill-opacity="0.7"/>
  <!-- Inner circuit dot -->
  <circle cx="16" cy="16" r="3" fill="url(#grad2)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="13" y1="13" x2="19" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
